services:
  redpanda:
    image: redpandadata/redpanda:v25.1.3
    command: [redpanda, start, --overprovisioned, --smp, '1', --memory, 512M, --reserve-memory, 0M, --node-id, '0', --check=false, --kafka-addr, '0.0.0.0:9092', --advertise-kafka-addr, 'redpanda:9092']
    healthcheck:
      test: [CMD, rpk, cluster, health]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [broker-data:/var/lib/redpanda/data]
  worker:
    build: ./worker
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda: {condition: service_healthy}
    restart: unless-stopped
  simulator:
    build: ./worker
    command: [node, simulator.js]
    env_file: .env
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda: {condition: service_healthy}
    restart: unless-stopped
volumes:
  broker-data:
